<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}

    <link rel="stylesheet" href="{% static 'pdfmerger/styles.css' %}" />
    <title>Unir PDFs</title>
  </head>
  <body class="container">
    <h1>Unificar PDFs</h1>
    <form
      action="{% url 'merge_pdfs' %}"
      method="post"
      enctype="multipart/form-data"
    >
      {% csrf_token %}
      <section class="file-inputs">
        <label> Primeiro PDF: </label>
        <input
          type="file"
          name="file1"
          accept="application/pdf"
          required
          multiple
        />
        <label> Segundo PDF: </label>
        <input type="file" name="file2" accept="application/pdf" required />
      </section>
      <button type="submit">📃 Unificar e baixar</button>
    </form>
  </body>
</html>
